<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Olho Branco</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600&display=swap">
<style>
/* Layout: uma cena fixa e preta. O olho é o botão e, ao abrir, a pupila vira a tela do vídeo. */
:root {
  --bg: #000000;
  --fg: #ffffff;
  --font-display: "Sora", system-ui, sans-serif;
  --dur: 1400ms;
  --ease: cubic-bezier(.72, 0, .18, 1);
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-display); }
.cena {
  position: fixed; inset: 0; overflow: hidden; background: var(--bg);
  display: grid; place-items: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.espiar {
  display: flex; flex-direction: column; align-items: center;
  width: min(600px, 100%); padding: 0; border: 0; border-radius: 24px;
  background: none; color: inherit; font: inherit; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.espiar:focus-visible { outline: 3px solid var(--fg); outline-offset: 8px; }
.espiar[disabled] { cursor: default; }
.rotulo {
  display: block; text-align: center; text-wrap: balance;
  font-size: clamp(20px, 5.6vw, 34px); line-height: 1.25; letter-spacing: -.02em;
  margin-bottom: clamp(-34px, -3vw, -8px);
  position: relative; z-index: 1;
  transition: opacity 240ms ease;
}
.olho {
  position: relative; display: block; width: 100%; aspect-ratio: 3 / 2;
  transform-origin: 49.92% 42.63%;
  transition: transform var(--dur) var(--ease);
}
@media (hover: hover) {
  .espiar:not([disabled]):hover .olho { transform: scale(1.04); }
}
.quadros, .olho svg { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
.quadros { background-repeat: no-repeat; background-size: 100% calc(100% * var(--n)); background-position: 0 calc(var(--f, 0) / (var(--n) - 1) * 100%); }
.olho svg { overflow: visible; }
.aberto .rotulo, .fechando .rotulo { opacity: 0; }
.aberto .quadros, .fechando .quadros { visibility: hidden; }
.pupila {
  position: fixed; left: 50%; top: var(--cy, 50%);
  width: var(--d, 300px); height: var(--d, 300px);
  margin: calc(var(--d, 300px) / -2) 0 0 calc(var(--d, 300px) / -2);
  border-radius: 50%; overflow: hidden; background: var(--bg);
  display: grid; place-items: center;
  visibility: hidden;
}
.aberto .pupila { transition: translate var(--dur) var(--ease), scale var(--dur) cubic-bezier(.85, 0, .35, 1); }
.fechando .pupila { transition: translate var(--dur) var(--ease), scale var(--dur) cubic-bezier(.65, 0, .15, 1); }
.aberto .pupila, .fechando .pupila { visibility: visible; }
.pupila video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.pupila video:not([src]) { display: none; }
.aviso {
  max-width: 70%; text-align: center; font-size: clamp(18px, 3.4vmin, 26px); line-height: 1.25;
  opacity: 0; transition: opacity 300ms ease;
}
.aberto.pronto .aviso { opacity: 1; }
.fechar {
  position: fixed; z-index: 2;
  top: calc(16px + env(safe-area-inset-top, 0px));
  right: max(16px, env(safe-area-inset-right, 0px));
  min-height: 44px; padding: 0 18px; border: 2px solid var(--fg); border-radius: 22px;
  background: var(--bg); color: var(--fg); font: inherit; font-size: 18px; cursor: pointer;
}
.fechar:focus-visible { outline: 3px solid var(--fg); outline-offset: 3px; }
.vaga {
  position: fixed; z-index: 2; left: 50%; box-sizing: border-box;
  bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  width: min(440px, calc(100% - 40px)); min-height: 64px; padding: 12px 20px;
  display: flex; align-items: center; justify-content: center; gap: 12px;
  background: var(--fg); color: var(--bg);
  font-size: clamp(17px, 4.6vw, 20px); letter-spacing: .03em; text-transform: uppercase; text-decoration: none;
  box-shadow: 0 0 0 6px var(--bg), 0 0 0 8px var(--fg);
  opacity: 0; visibility: hidden; transform: translate(-50%, 14px);
  transition: opacity 500ms ease, transform 500ms ease, visibility 500ms;
}
.vaga::after {
  content: ""; position: absolute; inset: -8px; border: 2px solid var(--fg);
  pointer-events: none; animation: chamar 2.2s ease-out infinite;
}
.vaga svg { width: 24px; height: 24px; flex: none; }
.vaga:focus-visible { outline: 3px solid var(--fg); outline-offset: 12px; }
.liberada .vaga { opacity: 1; visibility: visible; transform: translate(-50%, 0); }
@keyframes chamar {
  from { transform: scale(1); opacity: .9; }
  to { transform: scale(1.06, 1.3); opacity: 0; }
}
@media (hover: hover) {
  .vaga:hover { background: var(--bg); color: var(--fg); }
}
@media (prefers-reduced-motion: reduce) {
  :root { --dur: 1ms; }
  .vaga::after { animation: none; }
}
</style>

<script>
  // Coloque aqui o arquivo do vídeo, por exemplo: const VIDEO = "video.mp4";
  const VIDEO = "video.mp4";
  // Coloque aqui o link do checkout da Hotmart.
  const CHECKOUT = "";
  // Coloque aqui o ID do pixel da Meta (só os números).
  const PIXEL = "2049619776003567";

  if (PIXEL) {
    !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
    n.push=n;n.loaded=!0;n.version="2.0";n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
    document,"script","https://connect.facebook.net/en_US/fbevents.js");
    fbq("init", PIXEL);
    fbq("track", "PageView");
  }

  // Envia um evento ao pixel; personalizado = evento criado por nós.
  function rastrear(evento, personalizado) {
    if (window.fbq) fbq(personalizado ? "trackCustom" : "track", evento);
  }

  // Medidas do olho no desenho de 600 x 400.
  const CENTRO = { x: 299.5, y: 170.5 };
  const RAIO_IRIS = 55, RAIO_PUPILA = 17.5, PUPILA_FINAL = 0.92;

  const cena = document.getElementById("cena");
  const espiar = document.getElementById("espiar");
  const olho = document.getElementById("olho");
  const pupila = document.getElementById("pupila");
  const video = document.getElementById("video");
  const fechar = document.getElementById("fechar");
  const vaga = document.getElementById("vaga");
  if (CHECKOUT) vaga.href = CHECKOUT;
  else vaga.addEventListener("click", (e) => e.preventDefault());
  vaga.addEventListener("click", () => rastrear("CliqueGarantirVaga", true));
  // O botão de vaga só aparece quando o vídeo chega neste ponto, em segundos (1:40).
  const LIBERAR_VAGA = 100;
  function liberarVaga() { cena.classList.add("liberada"); }
  video.addEventListener("timeupdate", () => {
    if (video.currentTime >= LIBERAR_VAGA) liberarVaga();
  });
  let assistiu = false;
  video.addEventListener("timeupdate", () => {
    if (!assistiu && video.duration && video.currentTime / video.duration >= 0.75) {
      assistiu = true;
      rastrear("AssistiuVideo75", true);
    }
  });
  // O vídeo fica no arquivo video.mp4, na mesma pasta desta página.
  if (VIDEO) {
    video.src = VIDEO;
    document.querySelector(".aviso").hidden = true;
  }

  const DURACAO = 1400;
  let medida = null, temporizador = null;

  function medir() {
    const r = olho.getBoundingClientRect();
    const k = r.width / 600;
    const x = r.left + CENTRO.x * k, y = r.top + CENTRO.y * k;
    const vw = window.innerWidth, vh = window.innerHeight;
    const topo = 16, base = 112 + inferior();
    const livre = vh - topo - base;
    const iris = Math.min(vw * 0.9, livre);
    const cy = topo + livre / 2;
    const d = iris * PUPILA_FINAL;
    return { dx: vw / 2 - x, dy: cy - y, cy, s: iris / (2 * RAIO_IRIS * k), d, p0: (2 * RAIO_PUPILA * k) / d };
  }

  function inferior() {
    return parseFloat(getComputedStyle(vaga).bottom) - 24 || 0;
  }

  function posicionar(m) {
    pupila.style.setProperty("--cy", m.cy + "px");
    pupila.style.setProperty("--d", m.d + "px");
    pupila.style.translate = `${-m.dx}px ${-m.dy}px`;
    pupila.style.scale = String(m.p0);
  }

  function abrir() {
    olho.style.transition = "none";
    olho.style.transform = "none";
    const m = medida = medir();
    posicionar(m);
    void pupila.offsetWidth;
    cena.classList.remove("fechando");
    cena.classList.add("aberto");
    espiar.disabled = true;
    espiar.setAttribute("aria-hidden", "true");
    void olho.offsetWidth;
    olho.style.transition = "";
    olho.style.transform = `translate(${m.dx}px, ${m.dy}px) scale(${m.s})`;
    pupila.style.translate = "0px 0px";
    pupila.style.scale = "1";
    fechar.hidden = false;
    fechar.focus({ preventScroll: true });
    temporizador = setTimeout(() => { cena.classList.add("pronto"); if (!VIDEO) liberarVaga(); }, DURACAO);
  }

  function encerrar() {
    if (!cena.classList.contains("aberto")) return;
    video.pause();
    clearTimeout(temporizador);
    cena.classList.remove("pronto", "aberto");
    cena.classList.add("fechando");
    fechar.hidden = true;
    olho.style.transform = "";
    posicionar(medida);
    const dur = window.matchMedia("(prefers-reduced-motion: reduce)").matches ? 1 : DURACAO;
    setTimeout(() => {
      cena.classList.remove("fechando");
      olho.style.transform = "";
      espiar.disabled = false;
      espiar.removeAttribute("aria-hidden");
      espiar.focus({ preventScroll: true });
      iniciarAnimacao();
    }, dur);
  }

  // Animação do olho: mesmos quadros e tempos do GIF, para o som cair na piscada exata.
  const TEMPOS = [500, 500, 600, 100, 500, 500, 100, 500, 100, 600, 500, 600, 1000, 100, 300];
  const FECHADO = [3, 6, 13];
  const quadros = document.getElementById("quadros");
  const semMovimento = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let relogio = null, quadro = 0;

  function mostrar(i) { quadro = i; quadros.style.setProperty("--f", i); quadros.dataset.f = i; }

  function animar() {
    mostrar(quadro);
    if (FECHADO.includes(quadro)) somPiscada();
    relogio = setTimeout(() => { quadro = (quadro + 1) % TEMPOS.length; animar(); }, TEMPOS[quadro]);
  }

  function pararAnimacao() { clearTimeout(relogio); relogio = null; }

  const Ctx = window.AudioContext || window.webkitAudioContext;
  const audio = Ctx ? new Ctx() : null;
  const VOLUME = 0.25; // Volume da piscada: de 0 a 1.
  let piscada = null;

  if (audio) {
    const bytes = Uint8Array.from(atob(SOM.split(",")[1]), (c) => c.charCodeAt(0));
    audio.decodeAudioData(bytes.buffer, (b) => { piscada = b; });
  }

  function liberarAudio() {
    if (audio && audio.state === "suspended") return audio.resume();
    return Promise.resolve();
  }

  function somPiscada() {
    if (!piscada || audio.state !== "running" || document.hidden) return;
    const fonte = audio.createBufferSource();
    fonte.buffer = piscada;
    const volume = audio.createGain();
    volume.gain.value = VOLUME;
    fonte.connect(volume).connect(audio.destination);
    fonte.start();
  }

  // Ao clicar: o olho pisca uma vez, com som, e só então se expande.
  function clicar() {
    if (espiar.disabled) return;
    espiar.disabled = true;
    pararAnimacao();
    mostrar(FECHADO[0]);
    rastrear("ViewContent");
    // O vídeo começa no próprio clique, com som, para o navegador permitir o áudio.
    if (VIDEO) { if (video.ended) video.currentTime = 0; video.muted = false; video.play().catch(() => {}); }
    liberarAudio().then(somPiscada);
    setTimeout(() => { mostrar(0); abrir(); }, semMovimento ? 1 : 140);
  }

  document.addEventListener("pointerdown", liberarAudio);
  document.addEventListener("keydown", liberarAudio);
  espiar.addEventListener("click", clicar);
  iniciarAnimacao();
  fechar.addEventListener("click", encerrar);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") encerrar(); });
  window.addEventListener("resize", () => { if (cena.classList.contains("aberto")) encerrar(); });
